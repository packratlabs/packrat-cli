name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  release-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the five release targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o "dist/packrat-${target%/*}-${target#*/}" .
          done
      - name: The Linux binary is static
        run: file dist/packrat-linux-amd64 | tee /dev/stderr | grep -q "statically linked"
