name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  release-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the five release targets, their archives and checksums
        env:
          # setup-go pins the toolchain. GoReleaser needs a newer Go than go.mod; the binaries
          # are still built with the Go of go.mod.
          GOTOOLCHAIN: auto
        run: make release-dry
      - name: The checksums match and the binaries use the Go of go.mod
        run: |
          (cd dist && sha256sum -c checksums.txt)
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 5
          want="go$(sed -n 's/^go //p' go.mod)"
          for binary in dist/*/packrat dist/*/packrat.exe; do
            go version "$binary" | tee /dev/stderr | grep -q "$want\$"
          done
      - name: The Linux binary is static
        run: file dist/packrat_linux_amd64_v1/packrat | tee /dev/stderr | grep -q "statically linked"
